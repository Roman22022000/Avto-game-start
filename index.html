<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Traffic Infinity Mobile</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    overflow:hidden;
    background:#101010;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#181818;
}

/* UI */

#ui{
    position:fixed;
    top:12px;
    left:12px;
    z-index:10;

    color:white;

    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(6px);

    padding:10px 14px;
    border-radius:16px;

    font-size:14px;
}

/* GAME OVER */

#dead{
    position:fixed;
    inset:0;
    display:none;

    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:rgba(0,0,0,0.84);

    color:white;
    z-index:100;
}

#dead button{
    margin-top:16px;
    padding:14px 24px;

    border:none;
    border-radius:16px;

    font-size:18px;
    cursor:pointer;
}

/* MOBILE BUTTONS */

.controls{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

/* LEFT */

.leftControls{
    position:absolute;
    left:14px;
    bottom:24px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* RIGHT */

.rightControls{
    position:absolute;
    right:14px;
    bottom:24px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.ctrlBtn{
    width:76px;
    height:76px;

    border:none;
    border-radius:22px;

    background:rgba(255,255,255,0.12);

    color:white;
    font-size:28px;
    font-weight:bold;

    backdrop-filter:blur(8px);

    pointer-events:auto;

    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.05),
    0 0 20px rgba(0,0,0,0.35);
}

.ctrlBtn:active{
    transform:scale(0.94);
    background:rgba(255,255,255,0.2);
}

/* PHONE */

@media (max-width:700px){

    #ui{
        font-size:13px;
    }

    .ctrlBtn{
        width:82px;
        height:82px;
        font-size:30px;
    }
}
</style>
</head>
<body>

<div id="ui">
    <div>Дистанция:
        <span id="score">0</span>
    </div>
</div>

<div id="dead">
    <h1>Авария</h1>

    <div id="final"></div>

    <button onclick="restart()">
        Играть снова
    </button>
</div>

<!-- CONTROLS -->

<div class="controls">

    <!-- LEFT SIDE -->
    <div class="leftControls">

        <!-- FORWARD -->
        <button class="ctrlBtn"
        id="forwardBtn">↑</button>

        <!-- LEFT -->
        <button class="ctrlBtn"
        id="leftBtn">←</button>

    </div>

    <!-- RIGHT SIDE -->
    <div class="rightControls">

        <!-- FORWARD -->
        <button class="ctrlBtn"
        id="forwardBtn2">↑</button>

        <!-- RIGHT -->
        <button class="ctrlBtn"
        id="rightBtn">→</button>

    </div>

</div>

<canvas id="game"></canvas>

<script>
const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W,H;

function resize(){

    W = canvas.width =
    window.innerWidth;

    H = canvas.height =
    window.innerHeight;
}

resize();

window.addEventListener(
"resize",
resize
);

/* TILE SIZE ADAPTIVE */

function getTile(){

    if(W < 500) return 74;
    if(W < 900) return 82;

    return 96;
}

let TILE = getTile();

window.addEventListener("resize",()=>{
    TILE = getTile();
});

/* MAP */

const roads = new Map();
const lights = new Map();

function key(x,y){
    return x+","+y;
}

function addRoad(x,y){

    if(!roads.has(key(x,y))){

        roads.set(key(x,y),{
            x,y
        });

        if(Math.random() < 0.16){

            lights.set(key(x,y),{

                green:
                Math.random()>0.5,

                timer:0,

                delay:
                80 + Math.random()*120
            });
        }
    }
}

function generateRoads(startY){

    let mainX = 0;

    for(let y=startY;
        y<startY+70;
        y++){

        let prevX = mainX;

        let r = Math.random();

        if(r < 0.33){
            mainX--;
        }
        else if(r > 0.66){
            mainX++;
        }

        if(prevX !== mainX){

            let dir =
            mainX > prevX ? 1 : -1;

            for(let x=prevX;
                x !== mainX + dir;
                x += dir){

                addRoad(x,y);
            }
        }

        addRoad(mainX,y);

        /* SIDE ROADS */

        if(Math.random() < 0.75){

            let dir =
            Math.random()>0.5 ? 1 : -1;

            let len =
            2 + Math.floor(
            Math.random()*4);

            for(let i=1;
                i<=len;
                i++){

                addRoad(
                mainX + i*dir,
                y
                );
            }

            if(Math.random() < 0.5){

                let bx =
                mainX + len*dir;

                for(let j=1;
                    j<=4;
                    j++){

                    addRoad(
                    bx,
                    y+j
                    );
                }
            }
        }
    }
}

generateRoads(0);

/* PLAYER */

const player = {

    x:0,
    y:0,

    rot:0
};

let best = 0;
let dead = false;

/* MOVE */

function move(dx,dy){

    if(dead) return;

    let nx = player.x + dx;
    let ny = player.y + dy;

    if(ny < player.y){
        return;
    }

    if(!roads.has(key(nx,ny))){
        return;
    }

    let light =
    lights.get(key(nx,ny));

    if(light && !light.green){
        return;
    }

    player.x = nx;
    player.y = ny;

    if(dx > 0){
        player.rot = Math.PI/2;
    }

    if(dx < 0){
        player.rot = -Math.PI/2;
    }

    if(dy > 0){
        player.rot = 0;
    }

    if(player.y > best){

        best = player.y;

        score.innerText = best;
    }

    if(player.y % 20 === 0){

        generateRoads(
        player.y + 20
        );
    }
}

/* KEYBOARD */

window.addEventListener(
"keydown",
e=>{

    if(e.key==="ArrowUp"
    || e.key==="w"){

        move(0,1);
    }

    if(e.key==="ArrowLeft"
    || e.key==="a"){

        move(-1,0);
    }

    if(e.key==="ArrowRight"
    || e.key==="d"){

        move(1,0);
    }
});

/* BUTTONS */

function bindButton(id,fn){

    const btn =
    document.getElementById(id);

    btn.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        fn();
    });

    btn.addEventListener(
    "mousedown",
    e=>{

        e.preventDefault();

        fn();
    });
}

bindButton(
"leftBtn",
()=>move(-1,0)
);

bindButton(
"rightBtn",
()=>move(1,0)
);

bindButton(
"forwardBtn",
()=>move(0,1)
);

bindButton(
"forwardBtn2",
()=>move(0,1)
);

/* LIGHTS */

function updateLights(){

    for(let [k,l]
        of lights){

        l.timer++;

        if(l.timer > l.delay){

            l.timer = 0;

            l.green =
            !l.green;
        }
    }
}

/* ROAD CONNECTIONS */

function connect(x,y){

    return {

        up:
        roads.has(
        key(x,y+1)
        ),

        down:
        roads.has(
        key(x,y-1)
        ),

        left:
        roads.has(
        key(x-1,y)
        ),

        right:
        roads.has(
        key(x+1,y)
        )
    };
}

/* DRAW ROAD */

function drawRoad(tile,sx,sy){

    let c =
    connect(tile.x,tile.y);

    ctx.fillStyle =
    "#2c2c2c";

    ctx.fillRect(
    sx + TILE*0.25,
    sy + TILE*0.25,
    TILE*0.5,
    TILE*0.5
    );

    if(c.up){

        ctx.fillRect(
        sx + TILE*0.35,
        sy,
        TILE*0.3,
        TILE*0.5
        );
    }

    if(c.down){

        ctx.fillRect(
        sx + TILE*0.35,
        sy + TILE*0.5,
        TILE*0.3,
        TILE*0.5
        );
    }

    if(c.left){

        ctx.fillRect(
        sx,
        sy + TILE*0.35,
        TILE*0.5,
        TILE*0.3
        );
    }

    if(c.right){

        ctx.fillRect(
        sx + TILE*0.5,
        sy + TILE*0.35,
        TILE*0.5,
        TILE*0.3
        );
    }

    /* LINES */

    ctx.fillStyle =
    "#8c8c8c";

    if(c.up || c.down){

        for(let i=0;i<3;i++){

            ctx.fillRect(
            sx + TILE/2 - 2,
            sy + 10 + i*22,
            4,
            12
            );
        }
    }

    if(c.left || c.right){

        for(let i=0;i<3;i++){

            ctx.fillRect(
            sx + 10 + i*22,
            sy + TILE/2 - 2,
            12,
            4
            );
        }
    }
}

/* LIGHTS */

function drawLight(light,sx,sy){

    ctx.fillStyle = "#101010";

    ctx.fillRect(
    sx + TILE/2 - 8,
    sy + TILE/2 - 22,
    16,
    44
    );

    ctx.beginPath();

    ctx.arc(
    sx + TILE/2,
    sy + TILE/2 - 10,
    5,0,Math.PI*2
    );

    ctx.fillStyle =
    light.green
    ? "#330000"
    : "red";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
    sx + TILE/2,
    sy + TILE/2 + 10,
    5,0,Math.PI*2
    );

    ctx.fillStyle =
    light.green
    ? "lime"
    : "#003300";

    ctx.fill();
}

/* PLAYER */

function drawPlayer(){

    const sx = W/2;
    const sy = H - 170;

    ctx.save();

    ctx.translate(sx,sy);

    ctx.rotate(player.rot);

    ctx.fillStyle =
    "#00cfff";

    ctx.fillRect(
    -14,-24,
    28,48
    );

    ctx.fillStyle =
    "white";

    ctx.fillRect(
    -9,-16,
    18,10
    );

    ctx.fillStyle =
    "#1d1d1d";

    ctx.fillRect(-12,-20,5,9);
    ctx.fillRect(7,-20,5,9);

    ctx.fillRect(-12,11,5,9);
    ctx.fillRect(7,11,5,9);

    ctx.restore();
}

/* GAME LOOP */

function render(){

    ctx.clearRect(0,0,W,H);

    updateLights();

    for(let [k,tile]
        of roads){

        let sx =
        (tile.x-player.x)
        * TILE
        + W/2
        - TILE/2;

        let sy =
        H -
        (tile.y-player.y)
        * TILE
        - 170;

        if(
            sx < -TILE ||
            sy < -TILE ||
            sx > W+TILE ||
            sy > H+TILE
        ) continue;

        drawRoad(tile,sx,sy);

        let light =
        lights.get(k);

        if(light){

            drawLight(
            light,
            sx,
            sy
            );
        }
    }

    drawPlayer();

    requestAnimationFrame(
    render
    );
}

render();

/* RESTART */

function restart(){
    location.reload();
}
</script>

</body>
</html>
